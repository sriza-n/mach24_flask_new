<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8">
    <title>Position Data Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        #chart-container {
            position: relative;
            height: 100vh;
            overflow: hidden;
        }

        /* Custom dark theme styles */
        .dark-theme {
            background-color: #1f2937;
            color: #f9fafb;
        }

        .theme-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .control-btn {
            background: rgba(59, 130, 246, 0.8);
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(59, 130, 246, 1);
        }
    </style>
    <script src="{{ url_for('static', filename='lib/tailwind-browser.js') }}"></script>
</head>

<body class="bg-white dark:bg-gray-900 transition-colors duration-300">
    <div id="chart-container" class="bg-white dark:bg-gray-900"></div>
    <button id="controlBtn" class="control-btn absolute top-10 left-10 z-[1000]">Pause</button>
    <button id="themeToggle" class="theme-toggle">🌙 Dark</button>
    
    <script src="{{ url_for('static', filename='lib/echarts.min.js') }}"></script>
    <script src="{{ url_for('static', filename='lib/echarts-gl.min.js') }}"></script>
    <script>
        // Theme management
        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        
        // Check for saved theme preference or default to light
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.classList.toggle('dark', savedTheme === 'dark');
        updateThemeButton();

        function updateThemeButton() {
            const isDark = html.classList.contains('dark');
            themeToggle.textContent = isDark ? '☀️ Light' : '🌙 Dark';
        }

        themeToggle.addEventListener('click', () => {
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeButton();
            
            // Update chart theme
            updateChartTheme();
        });

        // Chart initialization
        var dom = document.getElementById('chart-container');
        var myChart = echarts.init(dom, null, {
            renderer: 'canvas',
            useDirtyRect: false
        });

        // Get current theme colors
        function getThemeColors() {
            const isDark = html.classList.contains('dark');
            return {
                backgroundColor: isDark ? '#1f2937' : '#ffffff',
                textColor: isDark ? '#f9fafb' : '#374151',
                gridColor: isDark ? '#374151' : '#e5e7eb',
                axisColor: isDark ? '#6b7280' : '#9ca3af'
            };
        }

        // Get data transmitted through Flask
        const initialData = JSON.parse('{{ data | tojson | safe }}');

        // Prepare data arrays
        var timeData = [];
        var xPosData = [];
        var yPosData = [];
        var altData = [];
        var data3D = [];

        // Process initial data
        initialData.forEach(record => {
            const teensyTime = parseFloat(record.teensytime);
            const xPos = parseFloat(record.x_pos);
            const yPos = parseFloat(record.y_pos);
            const alt = parseFloat(record.alt);

            // Update data arrays
            timeData.unshift(teensyTime);
            xPosData.unshift(xPos);
            yPosData.unshift(yPos);
            altData.unshift(alt);
            data3D.unshift([xPos, yPos, alt]);
        });

        // Configure 3D chart with theme support
        function getChartOption() {
            const colors = getThemeColors();
            
            return {
                title: {
                    text: 'Position Data Visualization',
                    left: 'center',
                    textStyle: {
                        color: colors.textColor,
                        fontSize: 18,
                        fontWeight: 'bold'
                    }
                },
                tooltip: {
                    formatter: function (params) {
                        return `X: ${params.value[0]}<br>Y: ${params.value[1]}<br>Altitude: ${params.value[2]}`;
                    },
                    backgroundColor: colors.backgroundColor,
                    borderColor: colors.gridColor,
                    textStyle: {
                        color: colors.textColor
                    }
                },
                backgroundColor: colors.backgroundColor,
                visualMap: {
                    show: true,
                    dimension: 2,
                    min: Math.min(...(altData.length > 0 ? altData : [0])),
                    max: Math.max(...(altData.length > 0 ? altData : [100])),
                    inRange: {
                        color: [
                            '#313695', '#4575b4', '#74add1', '#abd9e9', '#e0f3f8',
                            '#ffffbf', '#fee090', '#fdae61', '#f46d43', '#d73027', '#a50026'
                        ]
                    },
                    textStyle: {
                        color: colors.textColor
                    }
                },
                xAxis3D: {
                    type: 'value',
                    name: 'X Position',
                    nameTextStyle: {
                        color: colors.textColor
                    },
                    axisLabel: {
                        color: colors.axisColor
                    },
                    axisLine: {
                        lineStyle: {
                            color: colors.gridColor
                        }
                    }
                },
                yAxis3D: {
                    type: 'value',
                    name: 'Y Position',
                    nameTextStyle: {
                        color: colors.textColor
                    },
                    axisLabel: {
                        color: colors.axisColor
                    },
                    axisLine: {
                        lineStyle: {
                            color: colors.gridColor
                        }
                    }
                },
                zAxis3D: {
                    type: 'value',
                    name: 'Altitude',
                    scale: true,
                    min: function (value) {
                        return value.min * 0.9;
                    },
                    max: function (value) {
                        return value.max * 1.1;
                    },
                    nameTextStyle: {
                        color: colors.textColor
                    },
                    axisLabel: {
                        color: colors.axisColor
                    },
                    axisLine: {
                        lineStyle: {
                            color: colors.gridColor
                        }
                    }
                },
                grid3D: {
                    viewControl: {
                        projection: 'orthographic',
                        autoRotate: false,
                    },
                    environment: colors.backgroundColor,
                    light: {
                        main: {
                            color: colors.textColor,
                            intensity: html.classList.contains('dark') ? 0.8 : 1.2
                        },
                        ambient: {
                            intensity: html.classList.contains('dark') ? 0.3 : 0.4
                        }
                    }
                },
                series: [
                    {
                        type: 'scatter3D',
                        data: data3D,
                        symbolSize: 5,
                        itemStyle: {
                            opacity: 0.8
                        },
                        emphasis: {
                            itemStyle: {
                                color: '#ef4444'
                            }
                        }
                    },
                    {
                        type: 'line3D',
                        data: data3D,
                        lineStyle: {
                            width: 4,
                            opacity: 0.6,
                            color: html.classList.contains('dark') ? '#60a5fa' : '#3b82f6'
                        }
                    }
                ]
            };
        }

        // Initialize chart
        myChart.setOption(getChartOption());

        // Function to update chart theme
        function updateChartTheme() {
            const newOption = getChartOption();
            myChart.setOption(newOption, true); // true to not merge, replace completely
        }

        window.addEventListener('resize', myChart.resize);

        // Set up real-time updates
        let fetchDataInterval;

        function updateChart(newData) {
            const record = newData;

            // Extract and convert values
            const teensyTime = parseFloat(record.teensytime);
            const xPos = parseFloat(record.x_pos);
            const yPos = parseFloat(record.y_pos);
            const alt = parseFloat(record.alt);

            // Update data arrays
            timeData.push(teensyTime);
            xPosData.push(xPos);
            yPosData.push(yPos);
            altData.push(alt);
            data3D.push([xPos, yPos, alt]);

            // Update visual ranges if needed
            const minAlt = Math.min(...altData);
            const maxAlt = Math.max(...altData);
            const range = maxAlt - minAlt;

            // If altitude range is very small, expand it to make changes more visible
            const scaledMin = range < 1 ? minAlt - 1 : minAlt;
            const scaledMax = range < 1 ? maxAlt + 1 : maxAlt;

            const colors = getThemeColors();

            // Update chart with theme-aware colors
            myChart.setOption({
                visualMap: {
                    min: minAlt,
                    max: maxAlt,
                    textStyle: {
                        color: colors.textColor
                    }
                },
                zAxis3D: {
                    min: scaledMin,
                    max: scaledMax
                },
                series: [
                    {
                        type: 'scatter3D',
                        data: data3D
                    },
                    {
                        type: 'line3D',
                        data: data3D,
                        lineStyle: {
                            width: 4,
                            opacity: 0.6,
                            color: html.classList.contains('dark') ? '#60a5fa' : '#3b82f6'
                        }
                    }
                ]
            });

            console.log(`Updated with new point: X=${xPos}, Y=${yPos}, Alt=${alt}`);
        }

        function fetchData() {
            fetch('/latest_sw')
                .then(response => response.json())
                .then(newData => {
                    console.log('Latest data fetched:', newData);
                    updateChart(newData);
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        // Start fetching data at regular intervals
        fetchDataInterval = setInterval(fetchData, 1000);

        // Control button to pause/resume fetching data
        const controlBtn = document.getElementById('controlBtn');
        let isPaused = false;
        controlBtn.addEventListener('click', () => {
            if (isPaused) {
                fetchDataInterval = setInterval(fetchData, 1000);
                controlBtn.textContent = 'Pause';
            } else {
                clearInterval(fetchDataInterval);
                controlBtn.textContent = 'Resume';
            }
            isPaused = !isPaused;
        });
    </script>
</body>

</html>
