<body class="w-screen h-full min-h-screen sm:h-screen sm:overflow-hidden p-2">
    <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-full mx-auto px-4">
            <div class="flex justify-between items-center py-2">
                <div class="flex items-between space-x-2">
                    <!-- <div class="w-6 h-6 bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">

                    <h1
                        class="text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                        Mach24 Telemetry Dashboard
                    </h1>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <div id="connection-status" class="w-2 h-2 rounded-full bg-red-500 status-indicator"></div>
                        <span class="text-xs font-medium text-gray-600 dark:text-gray-300">Connection</span>
                    </div>
                    <div class="text-xs font-medium text-gray-600 dark:text-gray-300">
                        <span id="last-update" class="font-mono text-blue-600 dark:text-blue-400">--:--:--</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="h-3">
    </div>

    <div class="grid grid-cols-3 md:grid-cols-6 gap-2">
        <!-- Remote Status -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow compact-card card-hover border border-gray-100 dark:border-gray-700">
            <div class="flex items-center">
                <div id="remote-indicator"
                    class="w-6 h-6 rounded-full bg-gray-300 flex items-center justify-center status-indicator mr-2">
                    <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                        <path
                            d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z">
                        </path>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Remote</p>
                    <p id="remote-status" class="text-sm font-bold text-gray-900 dark:text-white data-value">
                        Disconnected</p>
                </div>
            </div>
        </div>

        <!-- Activation Status -->
        <div
            class="bg-white dark:bg-gray-800 rounded-lg shadow compact-card card-hover border border-gray-100 dark:border-gray-700">
            <div class="flex items-center">
                <div id="activation-indicator"
                    class="w-6 h-6 rounded-full bg-gray-300 flex items-center justify-center status-indicator mr-2">
                    <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.293l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 001.414 1.414L9 9.414V13a1 1 0 102 0V9.414l1.293 1.293a1 1 0 001.414-1.414z"
                            clip-rule="evenodd"></path>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Activation</p>
                    <p id="activation-status" class="text-sm font-bold text-gray-900 dark:text-white data-value">Standby
                    </p>
                </div>
            </div>
        </div>

        <!-- Ignition Status -->
        <div
            class="bg-white dark:bg-gray-800 rounded-lg shadow compact-card card-hover border border-gray-100 dark:border-gray-700">
            <div class="flex items-center">
                <div id="ignition-indicator"
                    class="w-6 h-6 rounded-full bg-gray-300 flex items-center justify-center status-indicator mr-2">
                    <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1011.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 017 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A2.99 2.99 0 0113 13a2.99 2.99 0 01-.879 2.121z"
                            clip-rule="evenodd"></path>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Ignition</p>
                    <p id="ignition-status" class="text-sm font-bold text-gray-900 dark:text-white data-value">
                        Off</p>
                </div>
            </div>
        </div>

        <!-- Parachute Status -->
        <div
            class="bg-white dark:bg-gray-800 rounded-lg shadow compact-card card-hover border border-gray-100 dark:border-gray-700">
            <div class="flex items-center">
                <div id="parachute-indicator"
                    class="w-6 h-6 rounded-full bg-gray-300 flex items-center justify-center status-indicator mr-2">
                    <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 2L3 9h14l-7-7zM9 11v6h2v-6H9z"></path>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Parachute</p>
                    <p id="parachute-status" class="text-sm font-bold text-gray-900 dark:text-white data-value">
                        Stowed</p>
                </div>
            </div>
        </div>

        <!-- Test Mode -->
        <div
            class="bg-white dark:bg-gray-800 rounded-lg shadow compact-card card-hover border border-gray-100 dark:border-gray-700">
            <div class="flex items-center">
                <div id="test-indicator"
                    class="w-6 h-6 rounded-full bg-gray-300 flex items-center justify-center status-indicator mr-2">
                    <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Test Mode</p>
                    <p id="test-status" class="text-sm font-bold text-gray-900 dark:text-white data-value">Off
                    </p>
                </div>
            </div>
        </div>

        <!-- Config Mode -->
        <div
            class="bg-white dark:bg-gray-800 rounded-lg shadow compact-card card-hover border border-gray-100 dark:border-gray-700">
            <div class="flex items-center">
                <div id="config-indicator"
                    class="w-6 h-6 rounded-full bg-gray-300 flex items-center justify-center status-indicator mr-2">
                    <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z"
                            clip-rule="evenodd"></path>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Config Mode</p>
                    <p id="config-status" class="text-sm font-bold text-gray-900 dark:text-white data-value">Off
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="h-2">
    </div>

    <div class="flex flex-col md:flex-row gap-2">
        <div class="md:basis-2/3 p-2 bg-blue-600 rounded-lg text-white flex items-center justify-center">
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 justify-items-center w-full h-full">
                <div
                    class="bg-gray-600 aspect-square rounded-lg text-white p-4 flex items-center justify-center w-full h-full">
                    1</div>
                <div
                    class="bg-gray-600 aspect-square rounded-lg text-white p-4 flex items-center justify-center w-full h-full">

                <div
