<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Management - Mach24</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <script src="{{ url_for('static', filename='lib/tailwind-browser.js') }}"></script>
    <!-- <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script> -->
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">Database Management</h1>
                    <p class="text-gray-600 dark:text-gray-300">Manage and switch between database files</p>
                </div>
                <!-- Theme Toggle Button -->
                <button onclick="toggleTheme()" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
                    <svg id="theme-icon-light" class="w-5 h-5 text-gray-800 dark:text-gray-200 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <svg id="theme-icon-dark" class="w-5 h-5 text-gray-800 dark:text-gray-200 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Current Database Info -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 dark:text-white mb-4">Current Database</h2>
            <div class="bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-700 rounded-lg p-4">
                <div class="flex items-center">
                    <svg class="w-6 h-6 text-blue-600 dark:text-blue-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 1.79 4 4 4h8c0-2.21-1.79-4-4-4H4V7z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7c0-2.21 1.79-4 4-4h8c2.21 0 4 1.79 4 4v10c0 2.21-1.79 4-4 4"></path>
                    </svg>
                    <span id="current-db" class="text-lg font-medium text-blue-800 dark:text-blue-200">Loading...</span>
                </div>
            </div>
        </div>

        <!-- Available Databases -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold text-gray-800 dark:text-white mb-4">Available Databases</h2>
            
            <!-- Refresh Button -->
            <button onclick="loadDatabases()" class="mb-4 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors">
                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Refresh
            </button>

            <!-- Database List -->
            <div id="database-list" class="space-y-3">
                <div class="text-center py-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
                    <p class="text-gray-600 dark:text-gray-400 mt-2">Loading databases...</p>
                </div>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="status-message" class="hidden fixed top-4 right-4 max-w-sm z-50"></div>
    </div>

    <script>
        let currentDatabase = null;

        // Load databases on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadDatabases();
            initializeTheme();
        });

        // Initialize theme from localStorage
        function initializeTheme() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        }

        // Function to load available databases
        async function loadDatabases() {
            try {
                const response = await fetch('/databases');
                const data = await response.json();
                
                currentDatabase = data.current;
                document.getElementById('current-db').textContent = data.current || 'None';
                
                renderDatabaseList(data.available);
            } catch (error) {
                console.error('Error loading databases:', error);
                showMessage('Error loading databases', 'error');
            }
        }

        // Function to render the database list
        function renderDatabaseList(databases) {
            const listContainer = document.getElementById('database-list');
            
            if (databases.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-8">
                        <svg class="w-12 h-12 text-gray-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-5.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 009.586 13H7"></path>
                        </svg>
                        <p class="text-gray-600 dark:text-gray-400">No database files found</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = databases.map(db => `
                <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4 ${db === currentDatabase ? 'bg-green-50 dark:bg-green-900/30 border-green-300 dark:border-green-700' : 'bg-gray-50 dark:bg-gray-700'}">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <svg class="w-6 h-6 ${db === currentDatabase ? 'text-green-600 dark:text-green-400' : 'text-gray-600 dark:text-gray-400'} mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 1.79 4 4 4h8c0-2.21-1.79-4-4-4H4V7z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7c0-2.21 1.79-4 4-4h8c2.21 0 4 1.79 4 4v10c0 2.21-1.79 4-4 4"></path>
                            </svg>
                            <div>
                                <p class="font-medium ${db === currentDatabase ? 'text-green-800 dark:text-green-200' : 'text-gray-800 dark:text-white'}">${db}</p>
                                ${db === currentDatabase ? '<p class="text-sm text-green-600 dark:text-green-400">Currently Active</p>' : ''}
                            </div>
                        </div>
                        <div class="flex space-x-2">
                            <!-- Download Button -->
                            <button onclick="downloadDatabase('${db}')" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1 rounded text-sm transition-colors flex items-center" title="Download as Excel">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                                XLSX
                            </button>
                            ${db !== currentDatabase ? `
                                <button onclick="switchDatabase('${db}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm transition-colors">
                                    Switch
                                </button>
                            ` : `
                                <span class="bg-green-600 text-white px-3 py-1 rounded text-sm">
                                    Active
                                </span>
                            `}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Function to download database as Excel
        async function downloadDatabase(filename) {
            try {
                showMessage('Preparing download...', 'info');
                
                // Create a temporary link to trigger download
                const link = document.createElement('a');
                link.href = `/convert_db_to_xlsx/${filename}`;
                link.download = filename.replace('.db', '.xlsx');
                
                // Add the link to body, click it, then remove it
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // Show success message after a short delay
                setTimeout(() => {
                    showMessage(`Download started for ${filename}`, 'success');
                }, 500);
                
            } catch (error) {
                console.error('Error downloading database:', error);
                showMessage('Error downloading database', 'error');
            }
        }

        // Function to switch database
        async function switchDatabase(filename) {
            try {
                showMessage('Switching database...', 'info');
                
                const response = await fetch(`/switch_database/${filename}`);
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message, 'success');
                    currentDatabase = filename;
                    loadDatabases(); // Reload the list
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                console.error('Error switching database:', error);
                showMessage('Error switching database', 'error');
            }
        }

        // Toggle theme function
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            
            if (isDark) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Function to show status messages
        function showMessage(message, type) {
            const messageDiv = document.getElementById('status-message');
            const bgColor = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';
            
            messageDiv.innerHTML = `
                <div class="${bgColor} text-white px-4 py-3 rounded-lg shadow-lg">
                    <div class="flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            ${type === 'success' ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>' : 
                              type === 'error' ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>' : 
                              '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>'}
                        </svg>
                        <span>${message}</span>
                    </div>
                </div>
            `;
            
            messageDiv.classList.remove('hidden');
            
            // Auto-hide after 3 seconds
            setTimeout(() => {
                messageDiv.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
