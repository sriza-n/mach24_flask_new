<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Visualization</title>
  <!-- Use CDN for ECharts -->
  <!-- <script type="text/javascript" src="static\js\visualize.js"></script> -->
  <script src="{{ url_for('static', filename='lib/tailwind-browser.js') }}"></script>
  <script src="{{ url_for('static', filename='lib/echarts.min.js') }}"></script>
  <script src="{{ url_for('static', filename='lib/echarts-gl.min.js') }}"></script>
</head>

<body
  class="w-screen h-screen md:overflow-hidden p-2 bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
  <header
    class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md shadow-sm border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-full mx-auto px-4">
      <div class="flex justify-between items-center py-2">
        <div class="flex items-center space-x-2">
          <h1
            class="text-lg sm:text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
            Mach24 Telemetry Dashboard
          </h1>
        </div>
        <div class="flex items-center space-x-2 sm:space-x-4">
          <div class="flex items-center space-x-2">
            <div id="connection-status" class="w-2 h-2 rounded-full bg-red-500 status-indicator">
            </div>
            <span class="text-xs font-medium text-gray-600 dark:text-gray-300 hidden sm:inline">Connection</span>
          </div>
          <div class="text-xs font-medium text-gray-600 dark:text-gray-300">
            <span id="last-update" class="font-mono text-blue-600 dark:text-blue-400">--:--:--</span>
          </div>
        </div>
      </div>
    </div>
  </header>
  <button id="controlBtn"
    class="bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 sm:px-3 sm:py-2 text-xs sm:text-sm items-center absolute top-16 sm:top-20 left-2 sm:left-4 z-[1000] rounded-lg shadow-md transition-colors">
    Pause
  </button>
  <div class="flex flex-col h-full gap-2">
    <div id="pressureChart" class="h-1/2 rounded-lg "></div>
    <div id="newton" class="h-1/2 rounded-lg"></div>
  </div>
</body>
<script>
  document.addEventListener('DOMContentLoaded', (event) => {
    const chartDom1 = document.getElementById('pressureChart');
    const chartDom2 = document.getElementById('newton');


    if (!chartDom2) {
      console.error('Element with id "loadcell1" not found');
      return;
    }

    const myChart = echarts.init(chartDom1, 'dark');

    const option = {
      animationDuration: 1000,
      // title: {
      //     text: 'Pressure Data Visualization'
      // },
      // backgroundColor: 'transparent',
      legend: {
        data: ['Pressure 1', 'Pressure 2'],
        textStyle: {
          // color: '#333'  // Ensure legend text remains visible
        },
        backgroundColor: 'transparent'
        // backgroundColor: 'rgb(0, 0, 0)',
      },
      tooltip: {
        order: 'valueDesc',
        trigger: 'axis'
      },
      toolbox: {
        feature: {
          saveAsImage: {},
          // brush: {},
          // restore: {},
          // dataView: {}
        }
      },
      xAxis: {
        type: 'category',
        name: 'Time (s)',
        nameLocation: 'middle',
        nameGap: 22,
        data: [] // Time labels
      },
      yAxis: {
        name: 'Pressure (psi)',
        nameLocation: 'middle',
        nameGap: 30,
        // offset:10
        // boundaryGap: ['20%']
      },
      grid: {
        left: '7%',
        right: '0%',
        top: '10%',
        bottom: '12%'
      },
      dataZoom: [
        // {
        //     type: 'slider',
        //     start: 0,
        //     end: 100
        // },
        {
          type: 'inside',
          start: 0,
          end: 100
        }
      ],
      series: [
        {
          name: 'Pressure 1',
          type: 'line',
          showSymbol: true,
          smooth: true,
          emphasis: {
            focus: 'series'
          },
          data: [] // Pressure 1 data
        },
        {
          name: 'Pressure 2',
          type: 'line',
          showSymbol: true,
          smooth: true,
          emphasis: {
            focus: 'series'
          },
          data: [] // Pressure 2 data
        }

      ]
    };

    // loadcell
    const loadChart = echarts.init(chartDom2, 'dark');
    // const loadChart = echarts.init(chartDom2);

    const loadoption = {
      animationDuration: 1000,
      // title: {
      //     text: 'Pressure Data Visualization'
      // },
      legend: {
        data: ['loadcell'],
        // textStyle: {
        //   color: '#333'  // Ensure legend text remains visible
        // },
        backgroundColor: 'transparent'
      },
      tooltip: {
        order: 'valueDesc',
        trigger: 'axis'
      },
      toolbox: {
        feature: {
          saveAsImage: {},
          // brush: {},
          // restore: {},
          // dataView: {}
        }
      },
      xAxis: {
        type: 'category',
        name: 'Time (s)',
        nameLocation: 'middle',
        data: [] // Time labels
        , nameGap: 22,
      },
      yAxis: {
        name: 'loadcell (N)',
        nameLocation: 'middle',
        nameGap: 30,
      },
      grid: {
         left: '7%',
        right: '0%',
        top: '10%',
        bottom: '20%'
      },
      dataZoom: [
        // {
        //     type: 'slider',
        //     start: 0,
        //     end: 100
        // },
        {
          type: 'inside',
          start: 0,
          end: 100
        }
      ],
      series: [
        {
          name: 'loadcell',
          type: 'line',
          showSymbol: true,
          smooth: true,
          emphasis: {
            focus: 'series'
          },
          data: [] // loadcell data
        }
      ]
    };


    myChart.setOption(option);
    loadChart.setOption(loadoption);

    // Plot initial data
    const initialData = JSON.parse('{{ data | tojson | safe }}');
    const timeSet = new Set();
    initialData.forEach(record => {
      console.log(record);
      const timeString = record.teensytime;
      const pressure1 = record.p1;
      const pressure2 = record.p2;

      const loadcell = record.load;

      console.log(timeString, pressure1, pressure2, loadcell);

      option.xAxis.data.unshift(timeString);
      option.series[0].data.unshift(pressure1);
      option.series[1].data.unshift(pressure2);

      // console.log('After unshift - xAxis data:', option.xAxis.data);

      //for loadcell
      loadoption.xAxis.data.unshift(timeString);
      loadoption.series[0].data.unshift(loadcell);
      timeSet.add(timeString);
    });

    myChart.setOption(option);
    loadChart.setOption(loadoption);


    let fetchDataInterval;
    const fetchData = () => {
      fetch('/latest_sw')
        .then(response => response.json())
        .then(data => {

          const latestData = data;
          console.log(latestData);
          const timeString = latestData.teensytime;
          const pressure1 = latestData.p1;
          const pressure2 = latestData.p2;

          const loadcell = latestData.load;

          option.xAxis.data.push(timeString);
          option.series[0].data.push(pressure1);
          option.series[1].data.push(pressure2);

          //for loadcell
          loadoption.xAxis.data.push(timeString);
          loadoption.series[0].data.push(loadcell);


          myChart.setOption(option);
          loadChart.setOption(loadoption);

        })
        .catch(error => console.error('Error fetching data:', error));
    };

    // Fetch data every 1 second
    fetchDataInterval = setInterval(fetchData, 1000);

    // Resize chart on window resize
    window.addEventListener('resize', () => {
      myChart.resize();
      loadChart.resize();
    });

    // Control button to pause/resume fetching data
    const controlBtn = document.getElementById('controlBtn');
    let isPaused = false;
    controlBtn.addEventListener('click', () => {
      if (isPaused) {
        fetchDataInterval = setInterval(fetchData, 1000);
        controlBtn.textContent = 'Pause';
      } else {
        clearInterval(fetchDataInterval);
        controlBtn.textContent = 'Resume';
      }
      isPaused = !isPaused;
    });
  });
</script>

</html>
